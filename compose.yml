services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - next:/workspace/.next
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}

volumes:
  node_modules:
  next:
